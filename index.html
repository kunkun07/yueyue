<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yueyue's Surprise</title>
    <style>
        /* --- 全局样式 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            overflow-x: hidden;
            color: #333;
        }

        /* 背景装饰 */
        .bg-cloud {
            position: fixed;
            top: 10%;
            left: 5%;
            font-size: 100px;
            opacity: 0.8;
            z-index: -1;
            animation: float 6s ease-in-out infinite;
        }
        .bg-cloud:nth-child(2) {
            top: 20%;
            right: 5%;
            font-size: 80px;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* 主容器 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative; /* 为 Canvas 定位提供参照 */
            z-index: 10; /* 确保内容在 Canvas 之上 */
        }

        /* 标题 */
        h1 {
            font-size: 2rem;
            color: #ff4d6d;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* 爱心按钮 */
        .heart-btn {
            font-size: 4rem;
            cursor: pointer;
            transition: transform 0.3s;
            animation: beat 1s infinite;
            margin: 20px 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .heart-btn:active {
            transform: scale(0.9);
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 幻灯片区域 */
        .slider-container {
            width: 100%;
            height: 400px;
            position: relative;
            overflow: hidden; /* 关键：隐藏跑出去的爱心 */
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            background-color: #fff;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide.active {
            opacity: 1;
        }

        /* 图片样式 */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 文字信件区域 */
        .letter-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: left;
            position: relative;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .letter-title {
            font-size: 1.2rem;
            color: #ff4d6d;
            margin-bottom: 10px;
            font-weight: bold;
            border-bottom: 2px dashed #ff4d6d;
            padding-bottom: 5px;
        }

        .letter-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
            white-space: pre-wrap;
            min-height: 60px;
        }

        /* 互动按钮 */
        .hug-btn {
            background: linear-gradient(45deg, #ff4d6d, #ff8fa3);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hug-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(255, 77, 109, 0.4);
        }

        .hint {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #999;
        }

        @media (max-width: 480px) {
            .slider-container { height: 350px; }
            h1 { font-size: 1.5rem; }
            .letter-content { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="bg-cloud">☁️</div>
    <div class="bg-cloud">☁️</div>

    <div class="container">
        <h1>Yueyue's Surprise</h1>
        <div class="heart-btn" id="startHeart">❤️</div>

        <div class="slider-container" id="slider">
            <!-- 图片将由 JS 动态生成 -->
        </div>

        <div class="letter-box">
            <div class="letter-title">写给悦悦宝</div>
            <div class="letter-content" id="letterText"></div>
        </div>

        <button class="hug-btn" id="hugBtn">给我一个抱抱 (Hug) 🤗</button>
        <div class="hint">点击爱心开始，点击抱抱接收爱意</div>
    </div>

    <audio id="bgm" loop>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- 配置区域 ---
        const config = {
            images: [
                '1.jpg', '2.jpg', '3.jpg', '4.jpg', 
                '5.jpg', '6.jpg', '7.jpg', '8.jpg', 
                '9.jpg', '10.jpg'
            ],
            slidesToShow: 1, 
            interval: 5000,
            messages: [
                "亲爱的悦悦宝，\n\n遇见你，是我这辈子最幸运的事。",
                "看着你的照片，\n我就忍不住想一直一直喜欢你。",
                "愿我的爱，\n能像这漫天星光一样包围着你。",
                "悦悦，\n未来的每一天，我都想陪在你身边。",
                "今天也是\n超级超级爱你的一天！\n\n永远爱你的，\n你的专属摄影师"
            ]
        };

        let currentSlideIndex = 0;
        let slideInterval = null;
        let isPlaying = false;
        let isTyping = false;
        let bgmElement = document.getElementById('bgm');
        let canvas = null;
        let animationId = null;

        // 初始化幻灯片结构
        function initSlider() {
            const sliderContainer = document.getElementById('slider');
            sliderContainer.innerHTML = '';
            config.images.forEach((imgSrc, index) => {
                const slide = document.createElement('div');
                slide.className = `slide ${index === 0 ? 'active' : ''}`;
                
                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = `Photo ${index + 1}`;
                img.onerror = function() {
                    this.src = 'https://via.placeholder.com/600x400/ffcccc/ff4d6d?text=Missing+Image';
                };
                
                slide.appendChild(img);
                sliderContainer.appendChild(slide);
            });
        }

        // 图片预加载
        function preloadImages() {
            let loadedCount = 0;
            config.images.forEach((imgSrc, index) => {
                const img = new Image();
                img.src = imgSrc;
                img.onload = () => {
                    loadedCount++;
                    if (loadedCount === config.images.length) {
                        startSlideshow();
                    }
                };
                img.onerror = () => {
                    loadedCount++;
                    if (loadedCount === config.images.length) {
                        startSlideshow();
                    }
                };
            });
        }

        // 幻灯片逻辑 (单张循环)
        function startSlideshow() {
            isPlaying = true;
            
            slideInterval = setInterval(() => {
                if (!isPlaying) return;

                const currentSlides = document.querySelectorAll('.slide');
                currentSlides.forEach(slide => {
                    slide.classList.remove('active');
                });

                currentSlideIndex = (currentSlideIndex + 1) % config.images.length;
                
                const newSlides = document.querySelectorAll('.slide');
                if (newSlides[currentSlideIndex]) {
                    newSlides[currentSlideIndex].classList.add('active');
                }

                updateLetter();

            }, config.interval);
        }

        function updateLetter() {
            const msgIndex = currentSlideIndex % config.messages.length;
            const text = config.messages[msgIndex];
            
            if (isTyping) return;
            
            document.getElementById('letterText').innerText = "";
            typeWriter(text, 0);
        }

        function typeWriter(text, i) {
            isTyping = true;
            if (i < text.length) {
                document.getElementById('letterText').innerHTML += text.charAt(i);
                setTimeout(() => typeWriter(text, i + 1), 50);
            } else {
                isTyping = false;
            }
        }

        // 音乐播放
        function playMusic() {
            if (!bgmElement) return;
            const playPromise = bgmElement.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.warn("音乐播放被阻止或文件未找到");
                });
            }
        }

        // 事件监听
        const startHeart = document.getElementById('startHeart');
        const hugBtn = document.getElementById('hugBtn');

        startHeart.addEventListener('click', () => {
            startHeart.style.display = 'none';
            playMusic();
            preloadImages();
        });

        hugBtn.addEventListener('click', () => {
            hugBtn.innerText = "啾咪! (Kiss) 💋";
            setTimeout(() => hugBtn.innerText = "给我一个抱抱 (Hug) 🤗", 2000);
            playMusic();
            createHeartRain();
        });

        // 爱心雨效果 (修复版：限制在容器内)
        function createHeartRain() {
            // 获取幻灯片容器作为画布背景
            const container = document.querySelector('.slider-container');
            
            // 如果画布已存在，先移除
            if (canvas) {
                canvas.remove();
            }

            canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 设置画布大小与容器一致
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            // 将画布定位到容器左上角
            canvas.style.position = 'absolute';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.zIndex = '10'; // 确保在图片之上
            container.appendChild(canvas);

            const hearts = [];
            const heartCount = 30; // 减少数量，避免太乱

            for (let i = 0; i < heartCount; i++) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height, // 从上方开始
                    size: Math.random() * 15 + 10,
                    speed: Math.random() * 3 + 2,
                    color: `hsl(${Math.random() * 60 + 330}, 100%, 60%)`
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hearts.forEach(heart => {
                    ctx.fillStyle = heart.color;
                    ctx.font = `${heart.size}px Arial`;
                    ctx.fillText('❤️', heart.x, heart.y);
                    
                    heart.y += heart.speed;
                    
                    // 如果爱心跑到容器底部，重置到顶部
                    if (heart.y > canvas.height) {
                        heart.y = -20;
                        heart.x = Math.random() * canvas.width;
                    }
                });
                animationId = requestAnimationFrame(draw);
            }

            draw();

            // 动画持续 3 秒后停止
            setTimeout(() => {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                canvas.remove();
                canvas = null;
            }, 3000);
        }

        // 初始化
        initSlider();

    </script>
</body>
</html>
