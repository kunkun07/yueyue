<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>给悦悦宝的惊喜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fff0f5; /* 浅粉色背景 */
        }

        /* 第一幕：开场 */
        #intro {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.8s ease;
        }

        .big-heart {
            font-size: 120px;
            color: #ff4d6d;
            cursor: pointer;
            animation: beat 1.2s infinite;
            user-select: none;
            text-shadow: 0 0 30px rgba(255, 77, 109, 0.6);
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .text {
            margin-top: 30px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            animation: fadeUp 1s ease 0.5s forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(-10px); }
        }

        /* 第二幕：主页 */
        #main {
            display: none;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #fff0f5 0%, #ffe4e1 100%);
            position: relative;
            overflow: hidden;
        }

        /* 背景装饰 */
        .bg-item {
            position: absolute;
            opacity: 0.6;
            pointer-events: none;
        }
        .cloud { font-size: 60px; animation: float 8s ease-in-out infinite; }
        .sakura { font-size: 24px; color: #ffb7b2; animation: fall 10s linear infinite; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

        /* 内容区 */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        .photo-box {
            width: 220px; height: 220px;
            background: white;
            border-radius: 50%;
            padding: 10px;
            box-shadow: 0 10px 40px rgba(255, 77, 109, 0.2);
            margin-bottom: 30px;
            display: flex; justify-content: center; align-items: center;
            border: 4px solid white;
        }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .photo-box .emoji { font-size: 80px; }

        .msg-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            max-width: 80%;
            margin-bottom: 30px;
            line-height: 1.6;
            font-size: 18px;
            color: #555;
        }

        .btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: all 0.3s;
        }
        .btn:active { transform: scale(0.95); }

        /* 爱心雨 Canvas */
        #canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 弹窗文字 */
        .popup {
            position: absolute;
            font-size: 24px;
            color: #ff4d6d;
            font-weight: bold;
            animation: pop 1s forwards;
            z-index: 20;
            pointer-events: none;
            text-shadow: 0 0 5px white;
        }
        @keyframes pop {
            0% { transform: scale(0) translateY(0); opacity: 0; }
            30% { transform: scale(1.4) translateY(-30px); opacity: 1; }
            100% { transform: scale(1) translateY(-60px); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 第一幕 -->
    <div id="intro">
        <div class="big-heart" id="heartBtn">❤️</div>
        <div class="text">点击爱心，开启惊喜</div>
    </div>

    <!-- 第二幕 -->
    <div id="main">
        <canvas id="canvas"></canvas>
        <!-- 背景装饰 -->
        <div class="bg-item cloud" style="top:10%; left:10%;">☁️</div>
        <div class="bg-item cloud" style="top:20%; right:15%; animation-delay:1s;">☁️</div>
        <div class="bg-item sakura" style="left:10%;">🌸</div>
        <div class="bg-item sakura" style="left:50%; animation-delay:2s;">🌸</div>
        <div class="bg-item sakura" style="left:80%;">🌸</div>

        <div class="content">
            <div class="photo-box">
                <!-- 如果有照片，取消下面这行的注释，并修改 src -->
                <!-- <img src="your-photo.jpg" alt="悦悦宝"> -->
                <div class="emoji">🥰</div>
            </div>

            <div class="msg-box" id="msgArea"></div>

            <button class="btn" id="hugBtn">领取抱抱 🤗</button>
        </div>
    </div>

    <script>
        // --- 1. 在这里修改你想说的话 ---
        const words = [
            "亲爱的悦悦宝，",
            "今天天气很好，就像你一样可爱。",
            "想告诉你，你是我生活中最温暖的阳光。",
            "谢谢你来到我的世界里，让我变得更好。",
            "以后的每一天，我都会一直陪在你身边。",
            "永远爱你，永远！❤️"
        ];
        // -----------------------------

        const intro = document.getElementById('intro');
        const main = document.getElementById('main');
        const heartBtn = document.getElementById('heartBtn');
        const msgArea = document.getElementById('msgArea');
        const hugBtn = document.getElementById('hugBtn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let isPlaying = false;
        let particles = [];

        // 点击爱心进入
        heartBtn.addEventListener('click', function(e) {
            e.stopPropagation(); // 防止冒泡
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                main.style.display = 'block';
                startMusic();
                startTyping();
                initRain();
            }, 800);
        });

        // 打字机效果
        let i = 0;
        function startTyping() {
            function type() {
                if (i < words.length) {
                    const line = words[i];
                    msgArea.innerHTML = '';
                    for(let j=0; j<line.length; j++) {
                        msgArea.innerHTML += line.charAt(j);
                        setTimeout(type, 100); // 打字速度
                        return;
                    }
                    i++;
                    setTimeout(type, 500); // 换行间隔
                }
            }
            type();
        }

        // 音乐播放
        function startMusic() {
            // 确保你的音乐文件名叫 bgm.mp3
            const audio = new Audio('bgm.mp3');
            audio.loop = true;
            audio.volume = 0.5;
            audio.play().catch(e => console.log("音乐播放需用户交互"));
        }

        // 抱抱特效
        hugBtn.addEventListener('click', function() {
            startRain();
            const praises = ["好可爱！", "真漂亮！", "我最喜欢的悦悦宝！", "抱抱！", "爱你！"];
            const txt = praises[Math.floor(Math.random() * praises.length)];
            showPopup(txt);
            hugBtn.innerText = "再抱一个！";
            setTimeout(() => hugBtn.innerText = "领取抱抱 🤗", 2000);
        });

        function showPopup(text) {
            const el = document.createElement('div');
            el.className = 'popup';
            el.innerText = text;
            el.style.left = Math.random() * 80 + 10 + '%';
            el.style.top = '40%';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // 爱心雨
        function initRain() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        function startRain() {
            if (particles.length > 0) return;
            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    size: Math.random() * 10 + 5,
                    speed: Math.random() * 3 + 2,
                    color: `hsl(${Math.random()*40+340}, 100%, 70%)`
                });
            }
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                // 画爱心
                const x = p.x;
                const y = p.y;
                const s = p.size;
                ctx.moveTo(x, y);
                ctx.bezierCurveTo(x, y-s/2, x-s/2, y-s, x-s/2, y-s/2);
                ctx.bezierCurveTo(x-s/2, y-s/2, x, y-s/2, x, y-s/2);
                ctx.bezierCurveTo(x, y-s/2, x+s/2, y-s/2, x+s/2, y-s/2);
                ctx.bezierCurveTo(x+s/2, y-s/2, x+s/2, y-s, x+s/2, y-s/2);
                ctx.bezierCurveTo(x+s/2, y-s, x, y-s/2, x, y);
                ctx.fill();
                p.y += p.speed;
                if(p.y > canvas.height) p.y = -20;
            });
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
