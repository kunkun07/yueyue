<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>给悦悦宝的惊喜</title>
    <style>
        /* 全局样式 - 适配手机 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }

        /* 第一幕：跳动爱心 */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease;
        }

        .heart {
            font-size: 80px; /* 手机端稍微小一点 */
            color: #ff4d6d;
            animation: heartbeat 1.5s infinite;
            cursor: pointer;
            user-select: none;
            text-shadow: 0 0 20px rgba(255, 77, 109, 0.5);
            margin-top: 20px;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        .intro-text {
            margin-top: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            animation: fadeIn 2s forwards 1s;
            text-align: center;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* 第二幕：主页面 */
        #main-content {
            display: none;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
            position: relative;
        }

        /* 背景装饰：云朵和樱花 */
        .bg-decoration {
            position: absolute;
            opacity: 0.6;
            pointer-events: none;
        }
        
        .cloud {
            font-size: 50px;
            animation: float 6s ease-in-out infinite;
        }

        .sakura {
            font-size: 20px;
            color: #ffb7b2;
            animation: fall 10s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* 内容容器 - 手机居中 */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 照片展示区 - 手机适配 */
        .photo-frame {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 50%;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 5px solid #fff;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .photo-placeholder {
            font-size: 40px;
            color: #ffb7b2;
        }

        /* 打字机文字 */
        .message-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            max-width: 80%;
            margin-bottom: 30px;
            word-wrap: break-word;
        }

        .message-text {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            min-height: 60px;
            font-weight: 500;
        }

        /* 按钮 */
        .btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.6);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* 爱心雨 Canvas */
        #love-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* 夸奖语弹窗 */
        .praise-popup {
            position: absolute;
            font-size: 20px;
            color: #ff4d6d;
            font-weight: bold;
            pointer-events: none;
            animation: popupFade 1.5s forwards;
            z-index: 60;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        @keyframes popupFade {
            0% { transform: scale(0) translateY(0); opacity: 0; }
            20% { transform: scale(1.2) translateY(-20px); opacity: 1; }
            100% { transform: scale(1) translateY(-80px); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 第一幕：开场 -->
    <div id="intro-screen">
        <div class="heart" onclick="startSurprise()">❤️</div>
        <div class="intro-text">点击爱心，开启惊喜</div>
    </div>

    <!-- 第二幕：主页面 -->
    <div id="main-content">
        <!-- 背景装饰 -->
        <div class="bg-decoration cloud" style="top: 10%; left: 10%;">☁️</div>
        <div class="bg-decoration cloud" style="top: 20%; right: 15%; animation-delay: 1s;">☁️</div>
        <div class="bg-decoration sakura" style="left: 10%; animation-duration: 8s;">🌸</div>
        <div class="bg-decoration sakura" style="left: 20%; animation-duration: 12s;">🌸</div>
        <div class="bg-decoration sakura" style="left: 50%; animation-duration: 10s;">🌸</div>
        <div class="bg-decoration sakura" style="left: 80%; animation-duration: 9s;">🌸</div>
        <div class="bg-decoration sakura" style="left: 90%; animation-duration: 11s;">🌸</div>

        <canvas id="love-rain"></canvas>

        <div class="container">
            <!-- 照片区域 -->
            <div class="photo-frame">
                <!-- 如果你有照片，请确保照片文件和这个 html 文件在同一个文件夹 -->
                <!-- 然后把下面这行的 src 改成你的照片文件名，例如 src="photo.jpg" -->
                <!-- <img src="photo.jpg" alt="悦悦宝"> -->
                <div class="photo-placeholder">🥰</div>
            </div>

            <div class="message-box">
                <div class="message-text" id="typewriter"></div>
            </div>

            <button class="btn" onclick="giveHug()">领取抱抱 🤗</button>
        </div>
    </div>

    <script>
        // --- 配置区域：在这里修改你想说的话 ---
        const messages = [
            "亲爱的悦悦宝，",
            "今天天气很好，就像你一样可爱。",
            "想告诉你，你是我生活中最温暖的阳光。",
            "谢谢你来到我的世界里，让我变得更好。",
            "以后的每一天，我都会一直陪在你身边。",
            "永远爱你，永远！❤️"
        ];
        // -------------------------------------

        let messageIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let audioPlaying = false;

        function startSurprise() {
            const intro = document.getElementById('intro-screen');
            const main = document.getElementById('main-content');
            
            // 隐藏开场，显示主页
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                main.style.display = 'block';
                startMusic();
                startTyping();
                startRain();
            }, 1000);
        }

        function startTyping() {
            const textElement = document.getElementById('typewriter');
            textElement.innerHTML = '';
            messageIndex = 0;
            charIndex = 0;
            isTyping = true;
            typeMessage();
        }

        function typeMessage() {
            if (messageIndex < messages.length) {
                const currentMsg = messages[messageIndex];
                if (charIndex < currentMsg.length) {
                    textElement.innerHTML += currentMsg.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeMessage, 150); 
                } else {
                    messageIndex++;
                    charIndex = 0;
                    setTimeout(typeMessage, 600); 
                }
            } else {
                isTyping = false;
            }
        }

        function giveHug() {
            if (isTyping) return; 
            
            startRain();
            
            const praises = ["好可爱！", "真漂亮！", "我最喜欢的悦悦宝！", "抱抱！", "爱你！"];
            const randomPraise = praises[Math.floor(Math.random() * praises.length)];
            
            createFloatingText(randomPraise);
            
            const btn = document.querySelector('.btn');
            btn.innerText = "再抱一个！";
            btn.style.background = "#ff6b81"; 
            setTimeout(() => {
                btn.innerText = "领取抱抱 🤗";
                btn.style.background = "#ff4d6d"; 
            }, 3000);
        }

        function createFloatingText(text) {
            const el = document.createElement('div');
            el.className = 'praise-popup';
            el.innerText = text;
            
            const x = Math.random() * window.innerWidth;
            el.style.left = x + 'px';
            el.style.top = '50%';
            
            document.body.appendChild(el);
            
            setTimeout(() => {
                el.remove();
            }, 1500);
        }

        // --- 爱心雨特效逻辑 ---
        const canvas = document.getElementById('love-rain');
        const ctx = canvas.getContext('2d');
        let rainParticles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 10 + 5;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = Math.random() * 2 - 1;
                this.color = `hsl(${Math.random() * 40 + 340}, 100%, 70%)`; 
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;

                if (this.y > canvas.height) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(0, -this.size / 2, -this.size / 2, -this.size, -this.size / 2, -this.size / 2);
                ctx.bezierCurveTo(-this.size / 2, -this.size / 2, 0, -this.size / 2, 0, -this.size / 2);
                ctx.bezierCurveTo(0, -this.size / 2, this.size / 2, -this.size / 2, this.size / 2, -this.size / 2);
                ctx.bezierCurveTo(this.size / 2, -this.size / 2, this.size / 2, -this.size, this.size / 2, -this.size / 2);
                ctx.bezierCurveTo(this.size / 2, -this.size, 0, -this.size / 2, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        function startRain() {
            if (rainParticles.length > 0) return; 
            for (let i = 0; i < 150; i++) { 
                rainParticles.push(new Particle());
            }
            animateRain();
        }

        function animateRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            rainParticles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateRain);
        }

        // --- 背景音乐逻辑 ---
        // 注意：浏览器通常要求用户交互后才能播放音频
        // 请确保 'bgm.mp3' 文件在 'yueyue-surprise' 文件夹内
        const audio = new Audio
